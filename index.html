<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14121c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Roguelite</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hp">
          <div class="hp-bar"><div id="hp-fill"></div><span id="hp-text"></span></div>
        </div>
        <div class="stats">
          <span id="depth"></span>
          <span id="level"></span>
          <span id="atkdef"></span>
          <span id="gold"></span>
        </div>
      </header>

      <main id="stage">
        <canvas id="view" aria-label="Dungeon map"></canvas>
        <div id="log" aria-live="polite"></div>
        <div id="dpad" hidden>
          <button data-dir="-1,-1" aria-label="Up left">↖</button>
          <button data-dir="0,-1" aria-label="Up">↑</button>
          <button data-dir="1,-1" aria-label="Up right">↗</button>
          <button data-dir="-1,0" aria-label="Left">←</button>
          <button data-act="wait" aria-label="Wait">·</button>
          <button data-dir="1,0" aria-label="Right">→</button>
          <button data-dir="-1,1" aria-label="Down left">↙</button>
          <button data-dir="0,1" aria-label="Down">↓</button>
          <button data-dir="1,1" aria-label="Down right">↘</button>
        </div>
        <div id="zoom">
          <button id="zoom-in" aria-label="Zoom in">+</button>
          <button id="zoom-out" aria-label="Zoom out">−</button>
        </div>
      </main>

      <footer id="bar">
        <div id="inv"></div>
        <div id="actions">
          <button id="btn-explore" title="Auto-explore (X)">Explore</button>
          <button id="btn-wait" title="Wait a turn (. or space)">Wait</button>
          <button id="btn-stairs" title="Go down (>)">Descend</button>
          <button id="btn-dpad" title="Show or hide the on-screen pad">Pad</button>
          <button id="btn-help" title="Help (?)">?</button>
        </div>
      </footer>

      <div id="overlay" hidden><div class="card" id="overlay-card"></div></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
